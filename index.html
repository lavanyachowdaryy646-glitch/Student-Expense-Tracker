<!DOCTYPE html>
<html>

<head>
    <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Expense Tracker</h1>

    <h2>Add Your Expense</h2>
  <label>Monthly Budget:</label>
<input type="number" id="budget" placeholder="Enter your monthly budget">

<br><br>

    <label>Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <br><br>

    <label>Category:</label>
    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Education</option>
        <option>Shopping</option>
        <option>Other</option>
    </select>

    <br><br>

    <label>Date:</label>
    <input type="date" id="date">

    <br><br>

    <label>Description:</label>
    <input type="text" id="description" placeholder="What did you spend on?">

    <br><br>

    <button onclick="addExpense()">Add 
    Expense</button>
    <h2>My Expenses</h2>
  <label>Filter by Category:</label>

<select id="filterCategory" onchange="displayExpenses()">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Education">Education</option>
    <option value="Shopping">Shopping</option>
    <option value="Other">Other</option>
</select>
    <div class="dashboard">

    <div class="box">
        <h3>Total Expenses</h3>
        <p>₹<span id="total">0</span></p>
    </div>

    <div class="box">
        <h3>Number of Expenses</h3>
        <p><span id="count">0</span></p>
    </div>

    <div class="box">
        <h3>Highest Expense</h3>
        <p>₹<span id="highest">0</span></p>
    </div>
      <div class="box">
    <h3>Remaining Budget</h3>
    <p>₹<span id="remaining">0</span></p>
      </div>

    </div>
    <div id="expenseList"></div>
    <script src="script.js"></script>
</body>

</html>
